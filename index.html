<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>艸｜荷蘭花選 FlowerForce</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Playfair+Display:ital,wght@0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#F7F2E9; --surface:#FFFDF8; --ink:#2E2A22; --ink-soft:#7A705F;
    --line:#E5DCC6; --line-soft:#EFE7D4;
    --leaf:#4B5D45; --leaf-dark:#33422F; --leaf-tint:#EAEEE2;
    --rose:#B5695A; --rose-dark:#8F4E42; --rose-tint:#F3E4DD;
    --gold:#B08A3E; --gold-tint:#F1E8D2;
    --ok:#4B7A5A; --ok-tint:#E7F0E5;
    --wait:#A67C33; --wait-tint:#F5EBD4;
    --font-serif:'Playfair Display','Noto Serif TC',serif;
    --font-display:'Cormorant Garamond','Noto Serif TC',serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:
    radial-gradient(1200px 400px at 50% -80px, #FFFCF4 0%, transparent 60%),
    var(--ground);
    color:var(--ink);font-family:"PingFang TC","Microsoft JhengHei",sans-serif;
  }
  .wrap{max-width:640px;margin:0 auto;padding:16px 16px 48px;}
  .brandmark{display:flex;align-items:center;justify-content:center;gap:10px;margin:6px 0 2px;}
  .brandmark .glyph{
    width:40px;height:40px;border-radius:50%;
    border:1px solid var(--gold);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-serif);font-size:19px;color:var(--leaf-dark);
    background:var(--surface);
    box-shadow:0 0 0 4px var(--gold-tint);
    flex-shrink:0;
  }
  .brandmark .brandtext{text-align:left;}
  .brandmark .brandtext .zh{font-family:var(--font-serif);font-size:19px;font-weight:700;color:var(--leaf-dark);letter-spacing:2px;line-height:1.1;}
  .brandmark .brandtext .en{font-family:var(--font-display);font-style:italic;font-size:12px;color:var(--gold);letter-spacing:1.5px;}
  h1{font-size:20px;margin:0;font-family:var(--font-serif);color:var(--leaf-dark);letter-spacing:.5px;}
  h2{font-size:15px;margin:0 0 14px;font-family:var(--font-serif);font-weight:700;color:var(--leaf-dark);letter-spacing:1px;text-align:center;position:relative;padding-bottom:12px;}
  h2::after{content:'';position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:64px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);}
  h2::before{content:'❧';position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);background:var(--surface);padding:0 8px;color:var(--gold);font-size:13px;}
  .muted{color:var(--ink-soft);font-size:13px;}
  .card{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:20px 16px;margin-top:14px;box-shadow:0 2px 14px rgba(75,93,69,.06);}
  .card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--rose),var(--gold),var(--leaf));}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px dashed var(--line);}
  .row:last-child{border-bottom:none;}
  .prod-info{display:flex;align-items:center;gap:10px;min-width:0;}
  .prod-thumb{width:50px;height:50px;object-fit:cover;border-radius:6px;border:1px solid var(--line);flex-shrink:0;background:var(--leaf-tint);}
  .prod-name{font-weight:700;font-family:var(--font-serif);font-size:14px;color:var(--ink);}
  .qty-btn{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:16px;cursor:pointer;color:var(--leaf-dark);}
  button.primary{background:var(--leaf-dark);color:#FBF8EF;border:none;border-radius:3px;padding:11px 18px;font-size:14px;cursor:pointer;font-weight:600;letter-spacing:1px;}
  button.secondary{background:var(--rose-tint);color:var(--rose-dark);border:none;border-radius:3px;padding:9px 14px;font-size:13px;cursor:pointer;font-weight:600;letter-spacing:.5px;}
  button.tiny{background:var(--leaf-tint);color:var(--leaf-dark);border:1px solid var(--line);border-radius:3px;padding:6px 11px;font-size:12px;cursor:pointer;font-weight:600;}
  input{padding:10px 11px;border:1px solid var(--line);border-radius:3px;font-size:14px;width:100%;background:#FFFEFB;}
  input:focus{outline:none;border-color:var(--gold);}
  .tab{padding:10px 16px;border-radius:6px 6px 0 0;cursor:pointer;font-weight:700;font-size:13px;letter-spacing:.5px;font-family:var(--font-serif);}
  .tab.active{background:var(--surface);color:var(--leaf-dark);border-top:2px solid var(--gold);}
  .tab.inactive{background:transparent;color:var(--ink-soft);border-top:2px solid transparent;}
  .badge-low{color:var(--rose-dark);font-weight:700;}
  .badge-ok{background:var(--ok-tint);color:var(--ok);padding:2px 9px;border-radius:20px;font-size:12px;letter-spacing:.5px;}
  .badge-wait{background:var(--wait-tint);color:var(--wait);padding:2px 9px;border-radius:20px;font-size:12px;letter-spacing:.5px;}
  #loginScreen{max-width:360px;margin:56px auto 0;text-align:center;}
  .divider-flourish{text-align:center;color:var(--gold);font-size:14px;margin:10px 0 18px;letter-spacing:6px;}
  .topbar{display:flex;justify-content:space-between;align-items:center;}
  .footer-mark{text-align:center;margin-top:28px;color:var(--ink-soft);font-family:var(--font-display);font-style:italic;font-size:13px;letter-spacing:1px;}
  .footer-mark .line{width:120px;height:1px;margin:8px auto;background:linear-gradient(90deg,transparent,var(--line),transparent);}
</style>
</head>
<body>
<div class="wrap">

  <div id="loginScreen" class="card">
    <div class="brandmark" style="justify-content:center;">
      <div class="glyph">艸</div>
    </div>
    <div style="font-family:var(--font-serif);font-size:22px;font-weight:700;color:var(--leaf-dark);letter-spacing:4px;margin-top:8px;">艸</div>
    <div style="font-family:var(--font-display);font-style:italic;color:var(--gold);font-size:13px;letter-spacing:2px;margin-top:2px;">HOLLAND FLOWER SELECT</div>
    <div class="muted" style="margin-top:2px;">荷蘭花選．B2B 訂花平台</div>
    <div class="divider-flourish">❦</div>
    <div style="margin-bottom:10px;"><input id="loginId" placeholder="花商編號 / 管理者帳號"></div>
    <div style="margin-bottom:14px;"><input id="loginSecret" type="password" placeholder="登記手機號碼 / 管理者密碼"></div>
    <button class="primary" style="width:100%;" onclick="doLogin()">登　入</button>
    <div id="loginMsg" class="muted" style="margin-top:10px;text-align:center;"></div>
  </div>

  <div id="mainScreen" style="display:none;">
    <div class="topbar">
      <div class="brandmark">
        <div class="glyph">艸</div>
        <div class="brandtext">
          <div class="zh" id="shopNameLabel"></div>
          <div class="muted" style="font-size:12px;">負責人：<span id="ownerLabel"></span></div>
        </div>
      </div>
      <button class="secondary" onclick="logout()">登出</button>
    </div>

    <div style="display:flex;gap:4px;margin-top:18px;">
      <div class="tab active" id="tabCatalogBtn" onclick="switchTab('catalog')">訂花</div>
      <div class="tab inactive" id="tabOrdersBtn" onclick="switchTab('orders')">我的訂單</div>
    </div>

    <div id="catalogPane" class="card" style="border-top-left-radius:0;margin-top:0;">
      <h2>目前可訂花材</h2>
      <div id="catalogList" class="muted">載入中...</div>
      <div style="margin-top:16px;text-align:right;">
        <button class="primary" onclick="submitCart()">送出訂購單</button>
      </div>
    </div>

    <div id="ordersPane" class="card" style="border-top-left-radius:0;margin-top:0;display:none;">
      <h2>我的訂單</h2>
      <div id="ordersList" class="muted">載入中...</div>
    </div>

    <div class="footer-mark"><div class="line"></div>艸　·　Holland Flower Select</div>
  </div>

  <div id="adminScreen" style="display:none;">
    <div class="topbar">
      <div class="brandmark">
        <div class="glyph">艸</div>
        <div class="brandtext">
          <div class="zh">管理後台</div>
          <div class="muted" style="font-size:12px;">艸．荷蘭花選</div>
        </div>
      </div>
      <button class="secondary" onclick="logout()">登出</button>
    </div>

    <div style="display:flex;gap:4px;margin-top:18px;">
      <div class="tab active" id="tabAdminOrdersBtn" onclick="switchAdminTab('orders')">訂單管理</div>
      <div class="tab inactive" id="tabAdminShopsBtn" onclick="switchAdminTab('shops')">花商管理</div>
      <div class="tab inactive" id="tabAdminStockBtn" onclick="switchAdminTab('stock')">庫存管理</div>
    </div>

    <div id="adminOrdersPane" class="card" style="border-top-left-radius:0;margin-top:0;">
      <h2>所有訂單</h2>
      <div id="adminOrdersList" class="muted">載入中...</div>
    </div>

    <div id="adminShopsPane" class="card" style="border-top-left-radius:0;margin-top:0;display:none;">
      <h2>花商列表</h2>
      <div id="adminShopsList" class="muted">載入中...</div>
    </div>

    <div id="adminStockPane" class="card" style="border-top-left-radius:0;margin-top:0;display:none;">
      <h2>庫存管理</h2>
      <div id="adminStockList" class="muted">載入中...</div>
    </div>

    <div class="footer-mark"><div class="line"></div>艸　·　Holland Flower Select</div>
  </div>

</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbyB-nSdCSbbm8Lm2CojEG5Rd8f5WMaxBENjXQUKEzpQg-SJV7SkT4R5dA2NeWyXAYwS/exec';

async function api(fn, args){
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify({fn, args: args || []})
  });
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || '發生錯誤');
  return json.data;
}

let SHOP = null;
let IS_ADMIN = false;
let PRODUCTS = [];
let CART = {};

function loadSession(){
  try {
    const raw = sessionStorage.getItem('ff_shop');
    if (raw) SHOP = JSON.parse(raw);
    IS_ADMIN = sessionStorage.getItem('ff_admin') === '1';
  } catch(e){ SHOP = null; IS_ADMIN = false; }
}
function saveSession(){
  try { sessionStorage.setItem('ff_shop', JSON.stringify(SHOP)); } catch(e){}
}
function saveAdminSession(){
  try { sessionStorage.setItem('ff_admin', '1'); } catch(e){}
}

async function doLogin(){
  const id = document.getElementById('loginId').value.trim();
  const secret = document.getElementById('loginSecret').value.trim();
  const msg = document.getElementById('loginMsg');
  msg.textContent = '登入中...';
  try {
    const isAdmin = await api('adminLogin', [id, secret]);
    if (isAdmin) {
      IS_ADMIN = true;
      saveAdminSession();
      enterAdminApp();
      return;
    }
  } catch(e) {
    // fall through to shop login
  }
  try {
    const res = await api('loginShop', [id, secret]);
    if (!res.ok) { msg.textContent = res.message; return; }
    SHOP = res.shop;
    saveSession();
    enterApp();
  } catch(e) {
    msg.textContent = '登入失敗：' + e.message;
  }
}

function logout(){
  SHOP = null;
  IS_ADMIN = false;
  try { sessionStorage.removeItem('ff_shop'); sessionStorage.removeItem('ff_admin'); } catch(e){}
  document.getElementById('loginScreen').style.display = '';
  document.getElementById('mainScreen').style.display = 'none';
  document.getElementById('adminScreen').style.display = 'none';
}

function enterApp(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('mainScreen').style.display = '';
  document.getElementById('shopNameLabel').textContent = SHOP.shopName || '';
  document.getElementById('ownerLabel').textContent = SHOP.owner || '';
  loadCatalog();
}

function enterAdminApp(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('adminScreen').style.display = '';
  loadAdminOrders();
}

function switchTab(name){
  const isCatalog = name === 'catalog';
  document.getElementById('catalogPane').style.display = isCatalog ? '' : 'none';
  document.getElementById('ordersPane').style.display = isCatalog ? 'none' : '';
  document.getElementById('tabCatalogBtn').className = 'tab ' + (isCatalog ? 'active' : 'inactive');
  document.getElementById('tabOrdersBtn').className = 'tab ' + (isCatalog ? 'inactive' : 'active');
  if (!isCatalog) loadOrders();
}

function switchAdminTab(name){
  const panes = {orders:'adminOrdersPane', shops:'adminShopsPane', stock:'adminStockPane'};
  const btns = {orders:'tabAdminOrdersBtn', shops:'tabAdminShopsBtn', stock:'tabAdminStockBtn'};
  Object.keys(panes).forEach(k => {
    document.getElementById(panes[k]).style.display = (k === name) ? '' : 'none';
    document.getElementById(btns[k]).className = 'tab ' + (k === name ? 'active' : 'inactive');
  });
  if (name === 'orders') loadAdminOrders();
  if (name === 'shops') loadAdminShops();
  if (name === 'stock') loadAdminStock();
}

async function loadCatalog(){
  try {
    PRODUCTS = await api('getCatalog', []);
    const el = document.getElementById('catalogList');
    el.innerHTML = PRODUCTS.map(p => `
      <div class="row">
        <div class="prod-info">
          <img class="prod-thumb" src="${p.imageUrl || ''}" onerror="this.style.visibility='hidden'" alt="${p.name}">
          <div>
            <div class="prod-name">${p.name}</div>
            <div class="muted">${p.origin} · NT$${p.price}/${p.unit}${p.stemsPerUnit ? ' · 每單位 ' + p.stemsPerUnit + ' 枝' : ''}${p.stock < p.safetyStock ? ' · <span class="badge-low">庫存偏低</span>' : ''}</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <button class="qty-btn" onclick="changeQty('${p.sku}',-1)">−</button>
          <span id="qty-${p.sku}" style="min-width:20px;text-align:center;font-weight:700;">${CART[p.sku] || 0}</span>
          <button class="qty-btn" onclick="changeQty('${p.sku}',1)">＋</button>
        </div>
      </div>`).join('');
  } catch(e) {
    document.getElementById('catalogList').textContent = '載入失敗：' + e.message;
  }
}

function changeQty(sku, delta){
  const cur = CART[sku] || 0;
  const next = Math.max(0, cur + delta);
  CART[sku] = next;
  const span = document.getElementById('qty-' + sku);
  if (span) span.textContent = next;
}

async function submitCart(){
  const items = Object.keys(CART).filter(sku => CART[sku] > 0).map(sku => {
    const p = PRODUCTS.find(x => x.sku === sku);
    return { sku, name: p.name, qty: CART[sku], unitPrice: p.price };
  });
  if (items.length === 0) { alert('請先選擇要訂購的花材數量'); return; }
  try {
    await api('submitOrder', [SHOP.shopId, items]);
    alert('訂購單已送出！');
    CART = {};
    loadCatalog();
    switchTab('orders');
  } catch(e) {
    alert('送出失敗：' + e.message);
  }
}

const STATUS_LABEL = {
  pending_arrival: '待到貨', pending: '待到貨', confirmed: '已確認金額', purchased: '已採購', arrived: '已到貨',
  settled: '已結清', cancel_requested: '申請取消中', modify_requested: '申請修改中', cancelled: '已取消'
};

async function loadOrders(){
  const el = document.getElementById('ordersList');
  el.textContent = '載入中...';
  try {
    const orders = await api('getShopOrders', [SHOP.shopId]);
    if (orders.length === 0) { el.textContent = '目前沒有任何訂單'; return; }
    el.innerHTML = orders.map(o => `
      <div class="row" style="display:block;">
        <div style="display:flex;justify-content:space-between;">
          <div style="font-weight:700;">${o.orderId}</div>
          <div class="badge-wait">${STATUS_LABEL[o.status] || o.status}</div>
        </div>
        <div class="muted">建立時間：${o.createdAt ? new Date(o.createdAt).toLocaleString('zh-TW') : ''}</div>
        <div class="muted">預估金額：NT$${o.estimatedAmount || 0}${o.finalAmount ? '　確認金額：NT$' + o.finalAmount : ''}</div>
        ${(o.status === 'pending' || o.status === 'pending_arrival') ? `<div style="margin-top:8px;"><button class="secondary" onclick="doCancel('${o.orderId}')">申請取消</button></div>` : ''}
        ${o.status === 'confirmed' ? `<div style="margin-top:8px;"><button class="primary" onclick="doConfirm('${o.orderId}')">確認金額無誤</button></div>` : ''}
      </div>`).join('');
  } catch(e) {
    el.textContent = '載入失敗：' + e.message;
  }
}

async function doCancel(orderId){
  if (!confirm('確定要申請取消這筆訂單嗎？')) return;
  try {
    const res = await api('cancelOrder', [SHOP.shopId, orderId]);
    alert(res.message || '已送出');
    loadOrders();
  } catch(e) { alert('操作失敗：' + e.message); }
}

async function doConfirm(orderId){
  try {
    await api('confirmOrderAmount', [orderId]);
    alert('已確認，請依約定方式結清貨款。');
    loadOrders();
  } catch(e) { alert('操作失敗：' + e.message); }
}

// ==== 管理後台 ====

async function loadAdminOrders(){
  const el = document.getElementById('adminOrdersList');
  el.textContent = '載入中...';
  try {
    const orders = await api('getAllOrders', []);
    if (orders.length === 0) { el.textContent = '目前沒有任何訂單'; return; }
    el.innerHTML = orders.map(o => {
      let actions = '';
      if (o.status === 'pending' || o.status === 'pending_arrival') {
        actions += `<button class="tiny" onclick="adminConfirm('${o.orderId}')">確認金額</button> `;
        actions += `<button class="tiny" onclick="adminMarkPurchased('${o.orderId}')">標記已採購</button>`;
      }
      if (o.status === 'purchased') {
        actions += `<button class="tiny" onclick="adminMarkArrived('${o.orderId}')">標記已到貨</button>`;
      }
      if (o.status === 'arrived' || o.status === 'confirmed') {
        actions += `<button class="tiny" onclick="adminRecordArrival('${o.orderId}')">登記到貨與帳款</button>`;
      }
      if (o.status === 'settled' || o.finalAmount) {
        actions += `<button class="tiny" onclick="adminMarkSettled('${o.orderId}')">標記已結清</button>`;
      }
      if (o.status === 'cancel_requested') {
        actions += `<button class="tiny" onclick="adminReviewCancel('${o.orderId}',true)">核准取消</button> `;
        actions += `<button class="tiny" onclick="adminReviewCancel('${o.orderId}',false)">駁回取消</button>`;
      }
      return `
      <div class="row" style="display:block;">
        <div style="display:flex;justify-content:space-between;">
          <div style="font-weight:700;">${o.orderId}　<span class="muted">${o.shopId || ''}</span></div>
          <div class="badge-wait">${STATUS_LABEL[o.status] || o.status}</div>
        </div>
        <div class="muted">建立時間：${o.createdAt ? new Date(o.createdAt).toLocaleString('zh-TW') : ''}</div>
        <div class="muted">預估金額：NT$${o.estimatedAmount || 0}${o.finalAmount ? '　確認金額：NT$' + o.finalAmount : ''}</div>
        <div style="margin-top:8px;">${actions}</div>
      </div>`;
    }).join('');
  } catch(e) {
    el.textContent = '載入失敗：' + e.message;
  }
}

async function adminConfirm(orderId){
  const amt = prompt('請輸入確認金額 (NT$)：');
  if (amt === null || amt.trim() === '') return;
  try {
    await api('adminConfirmAmount', [orderId, Number(amt)]);
    loadAdminOrders();
  } catch(e) { alert('操作失敗：' + e.message); }
}

async function adminMarkPurchased(orderId){
  try { await api('adminMarkPurchased', [orderId]); loadAdminOrders(); }
  catch(e) { alert('操作失敗：' + e.message); }
}

async function adminMarkArrived(orderId){
  try { await api('adminMarkArrived', [orderId]); loadAdminOrders(); }
  catch(e) { alert('操作失敗：' + e.message); }
}

async function adminRecordArrival(orderId){
  const amt = prompt('請輸入最終結算金額 (NT$)：');
  if (amt === null || amt.trim() === '') return;
  try { await api('recordArrivalAndBill', [orderId, Number(amt)]); loadAdminOrders(); }
  catch(e) { alert('操作失敗：' + e.message); }
}

async function adminMarkSettled(orderId){
  try { await api('markSettled', [orderId]); loadAdminOrders(); }
  catch(e) { alert('操作失敗：' + e.message); }
}

async function adminReviewCancel(orderId, approve){
  try { await api('adminReviewCancelRequest', [orderId, approve]); loadAdminOrders(); }
  catch(e) { alert('操作失敗：' + e.message); }
}

async function loadAdminShops(){
  const el = document.getElementById('adminShopsList');
  el.textContent = '載入中...';
  try {
    const shops = await api('getAllShops', []);
    el.innerHTML = shops.map(s => `
      <div class="row" style="display:block;">
        <div style="display:flex;justify-content:space-between;">
          <div style="font-weight:700;">${s.shopName}　<span class="muted">${s.shopId}</span></div>
          <div class="${s.status === 'active' ? 'badge-ok' : 'badge-wait'}">${s.status === 'active' ? '啟用中' : '待審核'}</div>
        </div>
        <div class="muted">負責人：${s.owner}　電話：${s.phone}</div>
        <div class="muted">地址：${s.address || ''}</div>
        <div style="margin-top:8px;">
          <button class="tiny" onclick="adminToggleShop('${s.shopId}','${s.status === 'active' ? 'pending' : 'active'}')">${s.status === 'active' ? '停用此花商' : '啟用此花商'}</button>
        </div>
      </div>`).join('');
  } catch(e) {
    el.textContent = '載入失敗：' + e.message;
  }
}

async function adminToggleShop(shopId, newStatus){
  try { await api('toggleShopStatus', [shopId, newStatus]); loadAdminShops(); }
  catch(e) { alert('操作失敗：' + e.message); }
}

async function loadAdminStock(){
  const el = document.getElementById('adminStockList');
  el.textContent = '載入中...';
  try {
    const products = await api('getInventory', []);
    el.innerHTML = products.map(p => `
      <div class="row">
        <div class="prod-info">
          <img class="prod-thumb" src="${p.imageUrl || ''}" onerror="this.style.visibility='hidden'" alt="${p.name}">
          <div>
            <div class="prod-name">${p.name}</div>
            <div class="muted">庫存：${p.stock}　安全庫存：${p.safetyStock}${p.stock < p.safetyStock ? ' · <span class="badge-low">偏低</span>' : ''}</div>
          </div>
        </div>
        <button class="tiny" onclick="adminUpdateStock('${p.sku}',${p.stock})">調整庫存</button>
      </div>`).join('');
  } catch(e) {
    el.textContent = '載入失敗：' + e.message;
  }
}

async function adminUpdateStock(sku, current){
  const val = prompt('輸入新庫存數量：', current);
  if (val === null || val.trim() === '') return;
  try { await api('updateStock', [sku, Number(val)]); loadAdminStock(); }
  catch(e) { alert('操作失敗：' + e.message); }
}

loadSession();
if (IS_ADMIN) { enterAdminApp(); }
else if (SHOP) { enterApp(); }
</script>
</body>
</html>
