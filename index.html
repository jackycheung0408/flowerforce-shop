<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>荷蘭花選 FlowerForce TW</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Playfair+Display:ital,wght@0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#FBF6EE; --surface:#FFFFFF; --ink:#2B2620; --ink-soft:#6B6354;
    --line:#E8DFCC; --leaf:#2F5233; --leaf-dark:#1F3A24; --leaf-tint:#E6EDE2;
    --rose:#C1573D; --rose-tint:#F6E4DC; --ok:#2F7A4F; --ok-tint:#E4F1E7;
    --wait:#B98A2E; --wait-tint:#F7EED9;
    --font-serif:'Playfair Display','Noto Serif TC',serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:"PingFang TC","Microsoft JhengHei",sans-serif;}
  .wrap{max-width:640px;margin:0 auto;padding:16px 16px 40px;}
  h1{font-size:20px;margin:0;font-family:var(--font-serif);color:var(--leaf-dark);letter-spacing:.5px;}
  h2{font-size:16px;margin:0 0 10px;font-family:var(--font-serif);color:var(--leaf-dark);padding-bottom:8px;border-bottom:2px dashed var(--line);position:relative;}
  h2::after{content:'❀';position:absolute;left:0;bottom:-11px;background:var(--surface);padding:0 6px;color:var(--rose);font-size:12px;}
  .muted{color:var(--ink-soft);font-size:13px;}
  .card{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px;}
  .card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--rose),var(--wait),var(--leaf));}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
  .row:last-child{border-bottom:none;}
  .prod-info{display:flex;align-items:center;gap:10px;min-width:0;}
  .prod-thumb{width:48px;height:48px;object-fit:cover;border-radius:8px;border:1px solid var(--line);flex-shrink:0;background:var(--leaf-tint);}
  .prod-name{font-weight:700;font-family:var(--font-serif);font-size:14px;}
  .qty-btn{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:16px;cursor:pointer;}
  button.primary{background:var(--leaf);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:14px;cursor:pointer;font-weight:700;}
  button.secondary{background:var(--rose-tint);color:var(--rose);border:none;border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer;font-weight:700;}
  button.tiny{background:var(--leaf-tint);color:var(--leaf-dark);border:none;border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;font-weight:700;}
  input{padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;width:100%;}
  .tab{padding:10px 14px;border-radius:10px 10px 0 0;cursor:pointer;font-weight:700;font-size:14px;}
  .tab.active{background:var(--surface);color:var(--leaf-dark);}
  .tab.inactive{background:var(--leaf-tint);color:var(--ink-soft);}
  .badge-low{color:var(--rose);font-weight:700;}
  .badge-ok{background:var(--ok-tint);color:var(--ok);padding:2px 8px;border-radius:6px;font-size:12px;}
  .badge-wait{background:var(--wait-tint);color:var(--wait);padding:2px 8px;border-radius:6px;font-size:12px;}
  #loginScreen{max-width:360px;margin:60px auto;}
  #adminLoginScreen{max-width:360px;margin:60px auto;display:none;}
  .topbar{display:flex;justify-content:space-between;align-items:center;}
  .link-btn{background:none;border:none;color:var(--ink-soft);font-size:12px;text-decoration:underline;cursor:pointer;padding:0;}
</style>
</head>
<body>
<div class="wrap">

  <div id="loginScreen" class="card">
    <h1 style="text-align:center;margin-bottom:16px;">荷蘭花選．花商登入</h1>
    <div style="margin-bottom:10px;"><input id="loginShopId" placeholder="花商編號 (shopId)"></div>
    <div style="margin-bottom:14px;"><input id="loginPhone" placeholder="登記手機號碼"></div>
    <button class="primary" style="width:100%;" onclick="doLogin()">登入</button>
    <div id="loginMsg" class="muted" style="margin-top:10px;text-align:center;"></div>
    <div style="margin-top:16px;text-align:center;">
      <button class="link-btn" onclick="showAdminLogin()">管理者登入</button>
    </div>
  </div>

  <div id="adminLoginScreen" class="card">
    <h1 style="text-align:center;margin-bottom:16px;">管理者登入</h1>
    <div style="margin-bottom:14px;"><input id="adminPinInput" type="password" placeholder="管理者 PIN"></div>
    <button class="primary" style="width:100%;" onclick="doAdminLogin()">登入</button>
    <div id="adminLoginMsg" class="muted" style="margin-top:10px;text-align:center;"></div>
    <div style="margin-top:16px;text-align:center;">
      <button class="link-btn" onclick="showShopLogin()">回花商登入</button>
    </div>
  </div>

  <div id="mainScreen" style="display:none;">
    <div class="topbar">
      <div>
        <h1 id="shopNameLabel"></h1>
        <div class="muted">負責人：<span id="ownerLabel"></span></div>
      </div>
      <button class="secondary" onclick="logout()">登出</button>
    </div>

    <div style="display:flex;gap:6px;margin-top:16px;">
      <div class="tab active" id="tabCatalogBtn" onclick="switchTab('catalog')">訂花</div>
      <div class="tab inactive" id="tabOrdersBtn" onclick="switchTab('orders')">我的訂單</div>
    </div>

    <div id="catalogPane" class="card" style="border-top-left-radius:0;">
      <h2>目前可訂花材</h2>
      <div id="catalogList" class="muted">載入中...</div>
      <div style="margin-top:14px;text-align:right;">
        <button class="primary" onclick="submitCart()">送出訂購單</button>
      </div>
    </div>

    <div id="ordersPane" class="card" style="border-top-left-radius:0;display:none;">
      <h2>我的訂單</h2>
      <div id="ordersList" class="muted">載入中...</div>
    </div>
  </div>

  <div id="adminScreen" style="display:none;">
    <div class="topbar">
      <div><h1>管理後台</h1></div>
      <button class="secondary" onclick="logout()">登出</button>
    </div>

    <div style="display:flex;gap:6px;margin-top:16px;">
      <div class="tab active" id="tabAdminOrdersBtn" onclick="switchAdminTab('orders')">訂單管理</div>
      <div class="tab inactive" id="tabAdminShopsBtn" onclick="switchAdminTab('shops')">花商管理</div>
      <div class="tab inactive" id="tabAdminStockBtn" onclick="switchAdminTab('stock')">庫存管理</div>
    </div>

    <div id="adminOrdersPane" class="card" style="border-top-left-radius:0;">
      <h2>所有訂單</h2>
      <div id="adminOrdersList" class="muted">載入中...</div>
    </div>

    <div id="adminShopsPane" class="card" style="border-top-left-radius:0;display:none;">
      <h2>花商列表</h2>
      <div id="adminShopsList" class="muted">載入中...</div>
    </div>

    <div id="adminStockPane" class="card" style="border-top-left-radius:0;display:none;">
      <h2>庫存管理</h2>
      <div id="adminStockList" class="muted">載入中...</div>
    </div>
  </div>

</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbyB-nSdCSbbm8Lm2CojEG5Rd8f5WMaxBENjXQUKEzpQg-SJV7SkT4R5dA2NeWyXAYwS/exec';

async function api(fn, args){
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify({fn, args: args || []})
  });
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || '發生錯誤');
  return json.data;
}

let SHOP = null;
let IS_ADMIN = false;
let PRODUCTS = [];
let CART = {};

function loadSession(){
  try {
    const raw = sessionStorage.getItem('ff_shop');
    if (raw) SHOP = JSON.parse(raw);
    IS_ADMIN = sessionStorage.getItem('ff_admin') === '1';
  } catch(e){ SHOP = null; IS_ADMIN = false; }
}
function saveSession(){
  try { sessionStorage.setItem('ff_shop', JSON.stringify(SHOP)); } catch(e){}
}
function saveAdminSession(){
  try { sessionStorage.setItem('ff_admin', '1'); } catch(e){}
}

function showAdminLogin(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('adminLoginScreen').style.display = '';
}
function showShopLogin(){
  document.getElementById('adminLoginScreen').style.display = 'none';
  document.getElementById('loginScreen').style.display = '';
}

async function doLogin(){
  const shopId = document.getElementById('loginShopId').value.trim();
  const phone = document.getElementById('loginPhone').value.trim();
  const msg = document.getElementById('loginMsg');
  msg.textContent = '登入中...';
  try {
    const res = await api('loginShop', [shopId, phone]);
    if (!res.ok) { msg.textContent = res.message; return; }
    SHOP = res.shop;
    saveSession();
    enterApp();
  } catch(e) {
    msg.textContent = '登入失敗：' + e.message;
  }
}

async function doAdminLogin(){
  const pin = document.getElementById('adminPinInput').value.trim();
  const msg = document.getElementById('adminLoginMsg');
  msg.textContent = '登入中...';
  try {
    const ok = await api('adminLogin', [pin]);
    if (!ok) { msg.textContent = 'PIN 錯誤'; return; }
    IS_ADMIN = true;
    saveAdminSession();
    enterAdminApp();
  } catch(e) {
    msg.textContent = '登入失敗：' + e.message;
  }
}

function logout(){
  SHOP = null;
  IS_ADMIN = false;
  try { sessionStorage.removeItem('ff_shop'); sessionStorage.removeItem('ff_admin'); } catch(e){}
  document.getElementById('loginScreen').style.display = '';
  document.getElementById('adminLoginScreen').style.display = 'none';
  document.getElementById('mainScreen').style.display = 'none';
  document.getElementById('adminScreen').style.display = 'none';
}

function enterApp(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('adminLoginScreen').style.display = 'none';
  document.getElementById('mainScreen').style.display = '';
  document.getElementById('shopNameLabel').textContent = SHOP.shopName || '';
  document.getElementById('ownerLabel').textContent = SHOP.owner || '';
  loadCatalog();
}

function enterAdminApp(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('adminLoginScreen').style.display = 'none';
  document.getElementById('adminScreen').style.display = '';
  loadAdminOrders();
}

function switchTab(name){
  const isCatalog = name === 'catalog';
  document.getElementById('catalogPane').style.display = isCatalog ? '' : 'none';
  document.getElementById('ordersPane').style.display = isCatalog ? 'none' : '';
  document.getElementById('tabCatalogBtn').className = 'tab ' + (isCatalog ? 'active' : 'inactive');
  document.getElementById('tabOrdersBtn').className = 'tab ' + (isCatalog ? 'inactive' : 'active');
  if (!isCatalog) loadOrders();
}

function switchAdminTab(name){
  const panes = {orders:'adminOrdersPane', shops:'adminShopsPane', stock:'adminStockPane'};
  const btns = {orders:'tabAdminOrdersBtn', shops:'tabAdminShopsBtn', stock:'tabAdminStockBtn'};
  Object.keys(panes).forEach(k => {
    document.getElementById(panes[k]).style.display = (k === name) ? '' : 'none';
    document.getElementById(btns[k]).className = 'tab ' + (k === name ? 'active' : 'inactive');
  });
  if (name === 'orders') loadAdminOrders();
  if (name === 'shops') loadAdminShops();
  if (name === 'stock') loadAdminStock();
}

async function loadCatalog(){
  try {
    PRODUCTS = await api('getCatalog', []);
    const el = document.getElementById('catalogList');
    el.innerHTML = PRODUCTS.map(p => `
      <div class="row">
        <div class="prod-info">
          <img class="prod-thumb" src="${p.imageUrl || ''}" onerror="this.style.visibility='hidden'" alt="${p.name}">
          <div>
            <div class="prod-name">${p.name}</div>
            <div class="muted">${p.origin} · NT$${p.price}/${p.unit}${p.stemsPerUnit ? ' · 每單位 ' + p.stemsPerUnit + ' 枝' : ''}${p.stock < p.safetyStock ? ' · <span class="badge-low">庫存偏低</span>' : ''}</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <button class="qty-btn" onclick="changeQty('${p.sku}',-1)">−</button>
          <span id="qty-${p.sku}" style="min-width:20px;text-align:center;font-weight:700;">${CART[p.sku] || 0}</span>
          <button class="qty-btn" onclick="changeQty('${p.sku}',1)">＋</button>
        </div>
      </div>`).join('');
  } catch(e) {
    document.getElementById('catalogList').textContent = '載入失敗：' + e.message;
  }
}

function changeQty(sku, delta){
  const cur = CART[sku] || 0;
  const next = Math.max(0, cur + delta);
  CART[sku] = next;
  const span = document.getElementById('qty-' + sku);
  if (span) span.textContent = next;
}

async function submitCart(){
  const items = Object.keys(CART).filter(sku => CART[sku] > 0).map(sku => {
    const p = PRODUCTS.find(x => x.sku === sku);
    return { sku, name: p.name, qty: CART[sku], unitPrice: p.price };
  });
  if (items.length === 0) { alert('請先選擇要訂購的花材數量'); return; }
  try {
    await api('submitOrder', [SHOP.shopId, items]);
    alert('訂購單已送出！');
    CART = {};
    loadCatalog();
    switchTab('orders');
  } catch(e) {
    alert('送出失敗：' + e.message);
  }
}

const STATUS_LABEL = {
  pending_arrival: '待到貨', pending: '待到貨', confirmed: '已確認金額', purchased: '已採購', arrived: '已到貨',
  settled: '已結清', cancel_requested: '申請取消中', modify_requested: '申請修改中', cancelled: '已取消'
};

async function loadOrders(){
  const el = document.getElementById('ordersList');
  el.textContent = '載入中...';
  try {
    const orders = await api('getShopOrders', [SHOP.shopId]);
    if (orders.length === 0) { el.textContent = '目前沒有任何訂單'; return; }
    el.innerHTML = orders.map(o => `
      <div class="row" style="display:block;">
        <div style="display:flex;justify-content:space-between;">
          <div style="font-weight:700;">${o.orderId}</div>
          <div class="badge-wait">${STATUS_LABEL[o.status] || o.status}</div>
        </div>
        <div class="muted">建立時間：${o.createdAt ? new Date(o.createdAt).toLocaleString('zh-TW') : ''}</div>
        <div class="muted">預估金額：NT$${o.estimatedAmount || 0}${o.finalAmount ? '　確認金額：NT$' + o.finalAmount : ''}</div>
        ${(o.status === 'pending' || o.status === 'pending_arrival') ? `<div style="margin-top:8px;"><button class="secondary" onclick="doCancel('${o.orderId}')">申請取消</button></div>` : ''}
        ${o.status === 'confirmed' ? `<div style="margin-top:8px;"><button class="primary" onclick="doConfirm('${o.orderId}')">確認金額無誤</button></div>` : ''}
      </div>`).join('');
  } catch(e) {
    el.textContent = '載入失敗：' + e.message;
  }
}

async function doCancel(orderId){
  if (!confirm('確定要申請取消這筆訂單嗎？')) return;
  try {
    const res = await api('cancelOrder', [SHOP.shopId, orderId]);
    alert(res.message || '已送出');
    loadOrders();
  } catch(e) { alert('操作失敗：' + e.message); }
}

async function doConfirm(orderId){
  try {
    await api('confirmOrderAmount', [orderId]);
    alert('已確認，請依約定方式結清貨款。');
    loadOrders();
  } catch(e) { alert('操作失敗：' + e.message); }
}

// ==== 管理後台 ====

async function loadAdminOrders(){
  const el = document.getElementById('adminOrdersList');
  el.textContent = '載入中...';
  try {
    const orders = await api('getAllOrders', []);
    if (orders.length === 0) { el.textContent = '目前沒有任何訂單'; return; }
    el.innerHTML = orders.map(o => {
      let actions = '';
      if (o.status === 'pending' || o.status === 'pending_arrival') {
        actions += `<button class="tiny" onclick="adminConfirm('${o.orderId}')">確認金額</button> `;
        actions += `<button class="tiny" onclick="adminMarkPurchased('${o.orderId}')">標記已採購</button>`;
      }
      if (o.status === 'purchased') {
        actions += `<button class="tiny" onclick="adminMarkArrived('${o.orderId}')">標記已到貨</button>`;
      }
      if (o.status === 'arrived' || o.status === 'confirmed') {
        actions += `<button class="tiny" onclick="adminRecordArrival('${o.orderId}')">登記到貨與帳款</button>`;
      }
      if (o.status === 'settled' || o.finalAmount) {
        actions += `<button class="tiny" onclick="adminMarkSettled('${o.orderId}')">標記已結清</button>`;
      }
      if (o.status === 'cancel_requested') {
        actions += `<button class="tiny" onclick="adminReviewCancel('${o.orderId}',true)">核准取消</button> `;
        actions += `<button class="tiny" onclick="adminReviewCancel('${o.orderId}',false)">駁回取消</button>`;
      }
      return `
      <div class="row" style="display:block;">
        <div style="display:flex;justify-content:space-between;">
          <div style="font-weight:700;">${o.orderId}　<span class="muted">${o.shopId || ''}</span></div>
          <div class="badge-wait">${STATUS_LABEL[o.status] || o.status}</div>
        </div>
        <div class="muted">建立時間：${o.createdAt ? new Date(o.createdAt).toLocaleString('zh-TW') : ''}</div>
        <div class="muted">預估金額：NT$${o.estimatedAmount || 0}${o.finalAmount ? '　確認金額：NT$' + o.finalAmount : ''}</div>
        <div style="margin-top:8px;">${actions}</div>
      </div>`;
    }).join('');
  } catch(e) {
    el.textContent = '載入失敗：' + e.message;
  }
}

async function adminConfirm(orderId){
  const amt = prompt('請輸入確認金額 (NT$)：');
  if (amt === null || amt.trim() === '') return;
  try {
    await api('adminConfirmAmount', [orderId, Number(amt)]);
    loadAdminOrders();
  } catch(e) { alert('操作失敗：' + e.message); }
}

async function adminMarkPurchased(orderId){
  try { await api('adminMarkPurchased', [orderId]); loadAdminOrders(); }
  catch(e) { alert('操作失敗：' + e.message); }
}

async function adminMarkArrived(orderId){
  try { await api('adminMarkArrived', [orderId]); loadAdminOrders(); }
  catch(e) { alert('操作失敗：' + e.message); }
}

async function adminRecordArrival(orderId){
  const amt = prompt('請輸入最終結算金額 (NT$)：');
  if (amt === null || amt.trim() === '') return;
  try { await api('recordArrivalAndBill', [orderId, Number(amt)]); loadAdminOrders(); }
  catch(e) { alert('操作失敗：' + e.message); }
}

async function adminMarkSettled(orderId){
  try { await api('markSettled', [orderId]); loadAdminOrders(); }
  catch(e) { alert('操作失敗：' + e.message); }
}

async function adminReviewCancel(orderId, approve){
  try { await api('adminReviewCancelRequest', [orderId, approve]); loadAdminOrders(); }
  catch(e) { alert('操作失敗：' + e.message); }
}

async function loadAdminShops(){
  const el = document.getElementById('adminShopsList');
  el.textContent = '載入中...';
  try {
    const shops = await api('getAllShops', []);
    el.innerHTML = shops.map(s => `
      <div class="row" style="display:block;">
        <div style="display:flex;justify-content:space-between;">
          <div style="font-weight:700;">${s.shopName}　<span class="muted">${s.shopId}</span></div>
          <div class="${s.status === 'active' ? 'badge-ok' : 'badge-wait'}">${s.status === 'active' ? '啟用中' : '待審核'}</div>
        </div>
        <div class="muted">負責人：${s.owner}　電話：${s.phone}</div>
        <div class="muted">地址：${s.address || ''}</div>
        <div style="margin-top:8px;">
          <button class="tiny" onclick="adminToggleShop('${s.shopId}','${s.status === 'active' ? 'pending' : 'active'}')">${s.status === 'active' ? '停用此花商' : '啟用此花商'}</button>
        </div>
      </div>`).join('');
  } catch(e) {
    el.textContent = '載入失敗：' + e.message;
  }
}

async function adminToggleShop(shopId, newStatus){
  try { await api('toggleShopStatus', [shopId, newStatus]); loadAdminShops(); }
  catch(e) { alert('操作失敗：' + e.message); }
}

async function loadAdminStock(){
  const el = document.getElementById('adminStockList');
  el.textContent = '載入中...';
  try {
    const products = await api('getInventory', []);
    el.innerHTML = products.map(p => `
      <div class="row">
        <div class="prod-info">
          <img class="prod-thumb" src="${p.imageUrl || ''}" onerror="this.style.visibility='hidden'" alt="${p.name}">
          <div>
            <div class="prod-name">${p.name}</div>
            <div class="muted">庫存：${p.stock}　安全庫存：${p.safetyStock}${p.stock < p.safetyStock ? ' · <span class="badge-low">偏低</span>' : ''}</div>
          </div>
        </div>
        <button class="tiny" onclick="adminUpdateStock('${p.sku}',${p.stock})">調整庫存</button>
      </div>`).join('');
  } catch(e) {
    el.textContent = '載入失敗：' + e.message;
  }
}

async function adminUpdateStock(sku, current){
  const val = prompt('輸入新庫存數量：', current);
  if (val === null || val.trim() === '') return;
  try { await api('updateStock', [sku, Number(val)]); loadAdminStock(); }
  catch(e) { alert('操作失敗：' + e.message); }
}

loadSession();
if (IS_ADMIN) { enterAdminApp(); }
else if (SHOP) { enterApp(); }
</script>
</body>
</html>
